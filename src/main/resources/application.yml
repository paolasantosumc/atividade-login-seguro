spring:
  application:
    name: login-seguro
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:login_seguro}
  session:
    timeout: 30m
    mongodb:
      collection-name: sessions
  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  theme:
    name: default
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:true}
      username: ${SEED_ADMIN_USERNAME:admin}
      email: ${SEED_ADMIN_EMAIL:admin@example.com}
      password: ${SEED_ADMIN_PASSWORD:ChangeMe_123!}
