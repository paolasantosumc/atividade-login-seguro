<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="auth-bg">
    <main class="card auth-card">
        <h1>Login Seguro</h1>
        <p class="muted">Acesse com suas credenciais.</p>
        <div class="alert error" th:if="${param.error}">Usuário ou senha inválidos.</div>
        <div class="alert success" th:if="${param.registered}">Cadastro realizado. Faça login.</div>
        <div class="alert success" th:if="${param.logout}">Sessão encerrada.</div>
        <form th:action="@{/login}" method="post">
            <label>Usuário
                <input name="username" autocomplete="username" required>
            </label>
            <label>Senha
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="primary" type="submit">Entrar</button>
        </form>
        <p>Não possui conta? <a th:href="@{/register}">Cadastre-se</a></p>
    </main>
</body>
</html>
