<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header th:fragment="header" class="topbar"><a class="brand" th:href="@{/dashboard}">Login Seguro</a>
        <nav><a sec:authorize="isAuthenticated()" th:href="@{/dashboard}">Início</a><a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Usuários</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="inline">
                <button class="link-button">Sair</button>
            </form>
        </nav>
    </header>
</body>
</html>
